<script type="text/x-dc" data-dc-script data-props='{"art":{"editor":"enum","options":["sansiro","amsterdam","bernabeu","stadedefrance","dragao","olimpico","campnou","metropolitano","allianz","signaliduna","parcdesprinces","celticpark","none"],"default":"sansiro"},"collected":{"editor":"boolean","default":true},"title":{"editor":"text","default":"San Siro"},"place":{"editor":"text","default":"Milan · Italy"},"match":{"editor":"text","default":"Inter Milan 1-5 Arsenal"},"date":{"editor":"text","default":"25 Nov 2003"},"$preview":{"width":180,"height":270}}'>
class Component extends DCLogic {
renderVals() {
var p = this.props;
var collected = p.collected == null ? true : !!p.collected;
var art = collected ? (p.art || 'sansiro') : 'none';
return {
pad: collected ? '5px' : '3px',
rootBorder: collected ? '0 solid transparent' : '2px dashed #b4b8c4',
frame: collected ? 'linear-gradient(135deg, #04214a 0%, #2a5591 45%, #c99b3f 50%, #2a5591 55%, #063672 100%)' : '#f7f8fb',
inner: collected ? '#ffffff' : 'transparent',
artBg: collected ? '#0e2f5c' : '#e9ecf2',
nameColor: collected ? '#0b1f3f' : '#44444e',
visitLabel: collected ? 'First visit' : 'Not yet visited',
name: p.title == null ? 'San Siro' : p.title,
place: p.place == null ? 'Milan · Italy' : p.place,
match: collected ? (p.match == null ? 'Inter Milan 1-5 Arsenal' : p.match) : '',
date: collected ? (p.date == null ? '25 Nov 2003' : p.date) : '',
isEmpty: art === 'none',
artSanSiro: art === 'sansiro',
artAmsterdam: art === 'amsterdam',
artBernabeu: art === 'bernabeu',
artStadeDeFrance: art === 'stadedefrance',
artDragao: art === 'dragao',
artOlimpico: art === 'olimpico',
artCampNou: art === 'campnou',
artMetropolitano: art === 'metropolitano',
artAllianz: art === 'allianz',
artSignalIduna: art === 'signaliduna',
artParcDesPrinces: art === 'parcdesprinces',
artCelticPark: art === 'celticpark'
};
}
}
</script>
