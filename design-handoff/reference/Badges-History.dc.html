<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2120}}'>
class Component extends DCLogic {
renderVals() {
var order = { gold: 0, silver: 1, bronze: 2 };
var rows = [
['bronze', '25 Nov 2003', 'Champions League', 'Inter Milan 1-5 Arsenal', 'San Siro', 'San Siro'],
['bronze', '9 Apr 2004', 'Premier League', 'Arsenal 4-2 Liverpool', 'Henry hat-trick', 'Highbury'],
['gold', '25 Apr 2004', 'Premier League', 'Tottenham Hotspur 2-2 Arsenal', 'Title won at the Lane', 'White Hart Lane'],
['silver', '15 May 2004', 'Premier League', 'Arsenal 2-1 Leicester City', 'Unbeaten season completed', 'Highbury'],
['silver', '21 Feb 2006', 'Champions League', 'Real Madrid 0-1 Arsenal', 'Henry at the Bernabéu', 'Santiago Bernabeu'],
['silver', '25 Apr 2006', 'Champions League', 'Villarreal 0-0 Arsenal', 'Qualified for first Champions League final', 'Estadio de la Ceramica'],
['bronze', '7 May 2006', 'Premier League', 'Arsenal 4-2 Wigan Athletic', 'Highbury farewell', 'Highbury'],
['bronze', '4 Mar 2008', 'Champions League', 'AC Milan 0-2 Arsenal', 'San Siro', 'San Siro'],
['bronze', '16 Feb 2011', 'Champions League', 'Arsenal 2-1 Barcelona', 'Champions League last 16', 'Emirates Stadium'],
['bronze', '26 Feb 2012', 'Premier League', 'Arsenal 5-2 Tottenham Hotspur', 'From 0-2 down', 'Emirates Stadium'],
['bronze', '17 Nov 2012', 'Premier League', 'Arsenal 5-2 Tottenham Hotspur', 'It happened again!', 'Emirates Stadium'],
['gold', '17 May 2014', 'FA Cup', 'Arsenal 3-2 Hull City', 'FA Cup final, trophy drought ends', 'Wembley Stadium']
];
return {
tickets: rows.slice().sort(function (a, b) { return order[a[0]] - order[b[0]]; }).map(function (r) {
return { tier: r[0], date: r[1], comp: r[2], match: r[3], why: r[4], venue: r[5] };
})
};
}
}
</script>
