<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop onboarding – Season ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Archivo+Black&amp;family=Archivo+Narrow:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#063672}a:hover{color:#04214a}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #f4f5f8; color: #2b2b33; font-family: Archivo, system-ui, sans-serif">
<div style="position: relative; overflow: hidden; flex: 1 1 400px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 56px; padding: 40px 48px; background: #db0007; color: #ffffff">
<svg aria-hidden="true" viewBox="0 0 420 420" style="position: absolute; left: -110px; bottom: -170px; width: 460px; height: 460px">
<circle cx="210" cy="210" r="150" fill="#c40006" stroke="#a3000c" stroke-width="2"></circle>
<ellipse cx="210" cy="210" rx="55" ry="150" fill="none" stroke="#a3000c" stroke-width="2"></ellipse>
<ellipse cx="210" cy="210" rx="110" ry="150" fill="none" stroke="#a3000c" stroke-width="2"></ellipse>
<path d="M210 60V360M60 210H360M80 135H340M80 285H340" fill="none" stroke="#a3000c" stroke-width="2"></path>
<ellipse cx="210" cy="210" rx="200" ry="64" transform="rotate(-24 210 210)" fill="none" stroke="#c99b3f" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"></ellipse>
</svg>
<div style="position: relative; display: flex">
<svg role="img" aria-label="We All Follow The Arsenal" viewBox="0 0 400 120" width="230" height="69" style="flex-shrink: 0">
<path d="M0 12H22M0 28H22M0 44H22M0 60H22M0 76H22M0 92H22M0 108H22M378 12H400M378 28H400M378 44H400M378 60H400M378 76H400M378 92H400M378 108H400" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"></path>
<rect x="20" y="0" width="360" height="120" fill="#ffffff"></rect>
<rect x="34" y="0" width="12" height="120" fill="#db0007"></rect>
<rect x="354" y="0" width="12" height="120" fill="#db0007"></rect>
<text x="200" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#063672" textLength="246" lengthAdjust="spacingAndGlyphs" style="font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif">WE ALL FOLLOW</text>
<text x="200" y="94" text-anchor="middle" font-size="38" fill="#db0007" textLength="276" lengthAdjust="spacingAndGlyphs" style="font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif">THE ARSENAL</text>
</svg>
</div>
<div style="position: relative; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px">
<div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #c99b3f; color: #063672; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
<div style="font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Welcome</div>
</div>
<div style="width: 0; height: 32px; margin: 4px 0 4px 14.5px; border-left: 3px solid #c99b3f"></div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #ffffff; color: #063672; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 14px">2</div>
<div style="font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">Season ticket</div>
</div>
<div style="width: 0; height: 32px; margin: 4px 0 4px 14.5px; border-left: 3px dotted rgba(255, 255, 255, 0.7)"></div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #a3000c; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 14px">3</div>
<div style="font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase">Home</div>
</div>
</div>
</div>
<div style="flex: 3 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 48px 64px">
<div style="width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 20px">
<a href="Desktop-Welcome.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; color: #063672; font-size: 15px; font-weight: 600">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
Back</a>
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1.05; text-transform: uppercase; color: #063672">Had a season ticket?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; text-wrap: pretty">Pick the season(s) and we'll mark every home league and cup game as attended. You can untick individual ones afterwards from the Fixtures tab.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5c5c66">Pick your seasons</div>
<div style="display: flex; gap: 4px">
<button type="button" onClick="{{ selectAll }}" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #063672; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer">Select all</button>
<button type="button" onClick="{{ clearAll }}" style="min-height: 44px; padding: 0 8px; margin-right: -8px; border: 0; background: transparent; color: #063672; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer">Clear</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(84px, 100%), 1fr)); gap: 8px">
<sc-for list="{{ seasons }}" as="s" hint-placeholder-count="38">
<button type="button" aria-pressed="{{ s.pressed }}" onClick="{{ s.pick }}" style="height: 44px; padding: 0; border-radius: 6px; border: 1px solid {{ s.bd }}; background: {{ s.bg }}; color: {{ s.fg }}; font-family: 'Archivo Narrow', 'Arial Narrow', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{ s.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; background: #e6ecf5; color: #063672">
<svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"></path><path d="M14 6v12" stroke-dasharray="2 3"></path></svg>
<div style="font-size: 15px; line-height: 1.4"><strong>{{ summaryLead }}</strong> {{ summaryRest }}</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 8px">
<a href="Desktop-Onboarding-3.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 28px; border-radius: 6px; background: #063672; color: #ffffff; font-size: 17px; font-weight: 700; text-decoration: none">Mark as attended &amp; continue
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<a href="Desktop-Onboarding-3.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #063672; font-size: 15px; font-weight: 600">Skip this step</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
selected() {
if (this.state && this.state.sel) return this.state.sel;
var d = {};
for (var y = 2006; y <= 2012; y++) d[y] = true;
return d;
}
renderVals() {
var self = this;
var sel = this.selected();
var seasons = [];
var count = 0;
for (var y = 1988; y <= 2025; y++) {
(function (year) {
var on = !!sel[year];
if (on) count++;
var next = String((year + 1) % 100);
if (next.length < 2) next = '0' + next;
seasons.push({
label: year + '/' + next,
pressed: on ? 'true' : 'false',
bg: on ? '#063672' : '#ffffff',
fg: on ? '#ffffff' : '#2b2b33',
bd: on ? '#063672' : '#c5c8d2',
pick: function () {
var copy = Object.assign({}, self.selected());
copy[year] = !copy[year];
self.setState({ sel: copy });
}
});
})(y);
}
return {
seasons: seasons,
summaryLead: count === 0 ? 'No seasons selected yet.' : count + (count === 1 ? ' season selected.' : ' seasons selected.'),
summaryRest: count === 0 ? 'Pick the seasons you held a season ticket for.' : 'Every home league and cup game in ' + (count === 1 ? 'it' : 'them') + ' will be marked as attended.',
selectAll: function () {
var all = {};
for (var i = 1988; i <= 2025; i++) all[i] = true;
self.setState({ sel: all });
},
clearAll: function () {
self.setState({ sel: {} });
}
};
}
}
</script>
</body>
</html>
